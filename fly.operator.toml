app = "startnew-operator-exykvj"
primary_region = "iad"

[build]
  dockerfile = "Operator-web/Dockerfile"

[env]
  PORT = "3000"
  CORS_ORIGIN = "*"
  OPERATOR_DATA_DIR = "/app/data"
  REQUEST_TIMEOUT_MS = "120000"
  OPERATOR_RUNTIME_V2 = "1"
  OPERATOR_EXEC_V3 = "1"
  OPERATOR_TOOL_REGISTRY_V2 = "1"
  OPERATOR_DATA_HOST_V1 = "1"
  OPERATOR_EXTENSION_HOST_V1 = "1"
  OPERATOR_LSP_HOST_V1 = "1"
  OPERATOR_PTY_BACKEND = "term-agent-pty"
  OPERATOR_PTY_HOST_MODE = "local"
  SEARCH_MODE = "terminal"
  ALLOW_TERMINAL_EXEC = "1"
  TERM_SESSION_ID = "operator"
  VNC_WORKDIR = "/projects/operator"
  OPERATOR_ENFORCED_ROOT = "/projects/operator"
  TERM_AGENT_URL = "https://startnew-workspace-exykvj.fly.dev"

[http_service]
  internal_port = 3000
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "off"
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[vm]
  cpu_kind = "shared"
  cpus = 2
  memory = "2048"
