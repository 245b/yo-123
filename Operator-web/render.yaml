services:
  - type: web
    name: operator-web
    env: docker
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    plan: free
    envVars:
      - key: PORT
        value: 3000
      - key: CORS_ORIGIN
        value: "*"
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: OPERATOR_REASONING_TIMEOUT_MS
        value: "0"
      - key: OPERATOR_TURN_TIMEOUT_MS
        value: "0"
      - key: DEEPSEEK_TURN_TIMEOUT_MS
        value: "0"
